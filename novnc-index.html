<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Desktop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; }
        .container { max-width: 800px; margin: 50px auto; padding: 20px; text-align: center; }
        h1 { margin-bottom: 20px; color: #e94560; }
        .btn { 
            display: inline-block; 
            padding: 15px 30px; 
            background: #e94560; 
            color: #fff; 
            text-decoration: none; 
            border-radius: 5px;
            font-size: 18px;
            margin: 10px;
        }
        .btn:hover { background: #c73e54; }
        .info { margin-top: 30px; padding: 20px; background: #16213e; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Remote Desktop Environment</h1>
        <p>Access your Ubuntu XFCE desktop through the browser</p>
        <a href="/vnc.html" class="btn">Open Desktop</a>
        <div class="info">
            <p>This provides a full Ubuntu desktop with:</p>
            <ul style="list-style: none; margin-top: 10px;">
                <li>XFCE Desktop Environment</li>
                <li>Google Chrome Browser</li>
                <li>Selenium WebDriver Support</li>
                <li>noVNC Web Access</li>
            </ul>
        </div>
    </div>
</body>
</html>
