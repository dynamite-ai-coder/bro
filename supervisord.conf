[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[program:xvfb]
command=Xvfb :0 -screen 0 %(ENV_RESOLUTION)s -ac +extension GLX +render -noreset -nolisten tcp
autorestart=true
startretries=10
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/local/bin/start-x11vnc.sh
autorestart=true
startretries=10
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xfce]
command=/usr/local/bin/start-xfce.sh
user=desktopuser
environment=DISPLAY=":0",HOME="/home/desktopuser",USER="desktopuser"
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=websockify 127.0.0.1:6080 localhost:5900
autorestart=true
startretries=10
priority=400
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:flask]
command=/opt/venv/bin/waitress-serve --listen=127.0.0.1:5000 --threads=8 app:app
directory=/
environment=PYTHONPATH="/"
autorestart=true
startretries=10
priority=450
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/local/bin/start-nginx.sh
autorestart=true
startretries=10
priority=500
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
